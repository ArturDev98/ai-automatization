version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /ci
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # typescript-eslint aún no admite TypeScript 7; quitar cuando lo soporte.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      desarrollo:
        dependency-type: development
