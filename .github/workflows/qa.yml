name: QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # La app bajo prueba es de terceros: una corrida diaria avisa si cambió.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  # En main no se cancela: una corrida a medias dejaría un despliegue de Pages cortado.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Calidad del código
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit

      - name: Suite UI y API
        id: suite
        run: npm test

      - name: Suite contra la versión con bugs sembrados
        id: bugs
        if: ${{ !cancelled() }}
        run: npm run test:bugs

      - name: Trazabilidad
        if: ${{ !cancelled() }}
        run: npm run trazabilidad

      - name: Panel
        if: ${{ !cancelled() }}
        run: npm run panel

      - name: Pruebas del panel generado
        if: ${{ !cancelled() }}
        run: npm run test:panel

      - name: Trazas y capturas de los fallos
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Empaquetar el sitio
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  publicar:
    needs: pruebas
    # Se publica aunque haya fallos: el panel tiene que mostrar el estado real.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
