name: QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # La app bajo prueba es de terceros: una corrida diaria avisa si cambió.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      destino:
        description: Dónde corre Toolshop
        type: choice
        options: [contenedor, publica]
        default: contenedor

permissions:
  contents: read

env:
  # La demo pública reta a los runners con Cloudflare: push y PR prueban contra contenedores.
  # La corrida diaria va contra la pública para enterarse si cambió.
  DESTINO: ${{ inputs.destino || (github.event_name == 'schedule' && 'publica' || 'contenedor') }}

concurrency:
  group: qa-${{ github.ref }}
  # En main no se cancela: una corrida a medias dejaría un despliegue de Pages cortado.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Calidad del código
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit

      - name: Toolshop en contenedores
        if: ${{ env.DESTINO == 'contenedor' }}
        run: |
          ci/toolshop.sh sprint5
          echo "UI_URL=http://localhost:4200" >> "$GITHUB_ENV"
          echo "API_URL=http://localhost:8091" >> "$GITHUB_ENV"

      - name: Suite UI y API
        id: suite
        run: npm test

      # Las dos versiones esperan la API en el mismo puerto: se cambia una por la otra.
      - name: Toolshop con bugs en contenedores
        id: toolshop_bugs
        if: ${{ !cancelled() && env.DESTINO == 'contenedor' }}
        run: |
          ci/toolshop.sh down
          ci/toolshop.sh sprint5-with-bugs
          echo "UI_BUGS_URL=http://localhost:4200" >> "$GITHUB_ENV"
          echo "API_BUGS_URL=http://localhost:8091" >> "$GITHUB_ENV"

      - name: Suite contra la versión con bugs sembrados
        id: bugs
        # Si sus contenedores no subieron, no se cae a la demo pública sin avisar.
        if: ${{ !cancelled() && steps.toolshop_bugs.outcome != 'failure' }}
        run: npm run test:bugs

      - name: Trazabilidad
        if: ${{ !cancelled() }}
        run: npm run trazabilidad

      - name: Panel
        if: ${{ !cancelled() }}
        run: npm run panel

      - name: Pruebas del panel generado
        if: ${{ !cancelled() }}
        run: npm run test:panel

      - name: Trazas y capturas de los fallos
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results*/
          retention-days: 7

      - name: Empaquetar el sitio
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  publicar:
    needs: pruebas
    # Se publica aunque haya fallos: el panel tiene que mostrar el estado real.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
